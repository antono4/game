<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tinyworldformer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffde1e'/%3E%3Cpath d='M16 16 L32 7 A14 14 0 0 1 32 25 Z' fill='%23111113'/%3E%3C/svg%3E">
<style>
  :root { --bg: #f6f5f2; --fg: #1d1d1f; --muted: #6b6b70; --line: #d9d8d3; --btn: #ffffff; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --fg: #ececee; --muted: #9a9aa2; --line: #2c2c31; --btn: #1c1c20; --accent: #fb923c; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 18px; color: var(--muted); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  select, button { font: inherit; color: var(--fg); background: var(--btn); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  canvas { display: block; width: 100%; max-width: 560px; margin: 0 auto; border-radius: 8px; background: #000; touch-action: none; box-shadow: 0 1px 3px rgba(0,0,0,.35), 0 8px 28px -12px rgba(0,0,0,.5); }
  .stats { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 12px 0; white-space: pre-wrap; min-height: 3em; }
  .keys { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; }
  .keys button { min-width: 64px; padding: 10px 14px; }
  .help { color: var(--muted); font-size: 13px; }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<main>
  <h1>tinyworldformer</h1>
  <p class="sub">There is no game code here. Every frame is dreamed by the int8 looped transformer that runs on the Pico 2 W, compiled to WebAssembly. Press any game key to take over from the agent.</p>
  <div class="bar">
    <select id="env" aria-label="game"></select>
    <button id="agent" title="g">agent plays</button>
    <button id="learn" title="l" aria-pressed="false">learn on the fly</button>
    <button id="relearn" title="r">learn from scratch</button>
    <select id="loops" aria-label="loops" title="1-4"></select>
    <button id="fast" title="f" aria-pressed="false">fast</button>
  </div>
  <canvas id="screen"></canvas>
  <div class="stats" id="stats">loading…</div>
  <div class="keys" id="pad"></div>
  <p class="help" id="help"></p>
</main>
<script>
// Per game: the keys the firmware reads (see web/src/lib.rs `key`) and what they do.
const KEYS = {
  breakout: [['a', '◀ left'], ['s', 'stop'], ['d', 'right ▶']],
  doomlite: [['a', '↺ turn'], ['w', '▲ forward'], ['d', 'turn ↻'], [' ', 'fire'], ['s', 'wait']],
  flappy:   [[' ', 'flap']],
  pacman:   [['a', '◀'], ['w', '▲'], ['s', '▼'], ['d', '▶'], [' ', 'keep going']],
  pong:     [['w', '▲ up'], [' ', 'stop'], ['s', '▼ down']],
};
const WON = { breakout: 'bricks', doomlite: 'kills', flappy: 'pipes', pacman: 'pellets', pong: 'points' };
const ARROWS = { ArrowUp: 'w', ArrowLeft: 'a', ArrowDown: 's', ArrowRight: 'd' };

const $ = id => document.getElementById(id);
const screen = $('screen'), ctx = screen.getContext('2d');
let wasm = null, game = '', fast = false, lastStep = 0, modelMs = 0, generation = 0, scale = 8;

// ---------- HD renderer ------------------------------------------------------------------
// The engine emits one colour per grid cell (16x20 .. 48x48). Blowing those cells up with
// `image-rendering: pixelated` gives large, uneven blocks, so the page reads the raw token grid
// and redraws each frame at display resolution: smooth gradients for sky/court/ceiling, crisp
// structure for walls/pipes/pellets, and real sprites for the ball, bird, Pac-Man and ghosts.
// Colours come from the frame itself, so the palette stays the one the model was trained on.

const PAL = {
  breakout: { wall: '#5a5a5a', paddle: '#3c8cdc', ball: '#ffffff' },
  pong: { wall: '#c8c8d2', net: '#464b5a', me: '#50aaff', cpu: '#ff5a50', hud: '#16161c',
          slotP: '#283c5a', slotC: '#5a2828' },
  flappy: { bush: '#55b446', grass: '#78d250', pipe: '#5fbe3c', pipeEdge: '#3c8728', pipeCap: '#8ce15a',
            hud: '#1e1e24', beak: '#fa7828', marker: '#ffffff', bird: '#ffd732' },
  doomlite: { enemy: '#be2d23', eye: '#ffe63c', gun: '#37373c', gunHi: '#9696a0', hud: '#141418',
              health: '#3cd25a', mapWall: '#8c8c8c', mapFloor: '#282830', mapEnemy: '#f03232',
              mapPlayer: '#5aaaff' },
  pacman: { wallFill: '#10165a', pellet: '#ffc8a0', hud: '#121216', body: '#ffde1e', eye: '#2b2b2b',
            ghostA: '#f01e1e', ghostB: '#ff8cd2', pupil: '#2b3cc8' },
};

const px3 = (rgba, i) => `rgb(${rgba[i * 4]},${rgba[i * 4 + 1]},${rgba[i * 4 + 2]})`;

// Rounded rectangles are what make the sprites read as shapes rather than blocks; polyfill the
// path for engines that predate `roundRect`.
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r);
    this.closePath();
  };
}

function box(c, x, y, w, h, fill, rad) {
  c.beginPath();
  if (rad) c.roundRect(x, y, w, h, rad); else c.rect(x, y, w, h);
  c.fillStyle = fill; c.fill();
}
function disc(c, x, y, r, fill, glow) {
  if (glow) { c.save(); c.shadowColor = glow; c.shadowBlur = r * 1.8; }
  c.beginPath(); c.arc(x, y, r, 0, 7); c.fillStyle = fill; c.fill();
  if (glow) c.restore();
}
/** Vertical gradient from the frame's own background colours, one stop per background row. */
function bgGradient(c, tok, rgba, W, H, S, isBg) {
  const g = c.createLinearGradient(0, 0, 0, H * S);
  let any = false;
  for (let r = 0; r < H; r++) {
    for (let col = 0; col < W; col++) {
      if (isBg(tok[r * W + col])) { g.addColorStop((r + 0.5) / H, px3(rgba, r * W + col)); any = true; break; }
    }
  }
  return any ? g : null;
}

function drawBreakout(c, tok, rgba, S, W, H) {
  box(c, 0, 0, W * S, H * S, '#000');
  for (let r = 0; r < H; r++) for (let col = 0; col < W; col++) {
    const t = tok[r * W + col], x = col * S, y = r * S;
    if (t === 1) box(c, x, y, S, S, PAL.breakout.wall);
    else if (t === 2) {                                   // brick: row colour plus a bevel
      box(c, x, y, S, S, px3(rgba, r * W + col));
      box(c, x, y, S, S * 0.16, 'rgba(255,255,255,.28)');
      box(c, x, y + S * 0.84, S, S * 0.16, 'rgba(0,0,0,.32)');
    } else if (t === 3) {                                 // paddle: rounded, with a highlight
      box(c, x, y + S * 0.12, S, S * 0.76, PAL.breakout.paddle, S * 0.32);
      box(c, x + S * 0.08, y + S * 0.2, S * 0.84, S * 0.22, 'rgba(255,255,255,.3)', S * 0.2);
    }
  }
  for (let i = 0; i < W * H; i++) if (tok[i] >= 4) {
    disc(c, (i % W + 0.5) * S, ((i / W | 0) + 0.5) * S, S * 0.42, PAL.breakout.ball, 'rgba(255,255,255,.8)');
  }
}

function drawPong(c, tok, rgba, S, W, H) {
  const g = bgGradient(c, tok, rgba, W, H, S, t => t === 0);
  if (g) { c.fillStyle = g; c.fillRect(0, 0, W * S, H * S); }
  for (let r = 0; r < H; r++) for (let col = 0; col < W; col++) {
    const t = tok[r * W + col], x = col * S, y = r * S;
    if (t === 1) box(c, x, y, S, S, PAL.pong.wall);
    else if (t === 2 && r % 2 === 0) box(c, x + S * 0.28, y + S * 0.15, S * 0.44, S * 0.7, PAL.pong.net);
    else if (t === 3 || t === 4) {                        // paddles, with a glow
      const col = t === 3 ? PAL.pong.me : PAL.pong.cpu;
      c.save(); c.shadowColor = col; c.shadowBlur = S * 1.1;
      box(c, x, y, S, S, col, S * 0.35); c.restore();
    }
    else if (t === 5) box(c, x, y, S, S, PAL.pong.hud);
    else if (t === 6 || t === 8) box(c, x + S * 0.12, y + S * 0.2, S * 0.76, S * 0.6, t === 6 ? PAL.pong.slotP : PAL.pong.slotC, S * 0.2);
    else if (t === 7 || t === 9) box(c, x + S * 0.12, y + S * 0.2, S * 0.76, S * 0.6, t === 7 ? PAL.pong.me : PAL.pong.cpu, S * 0.2);
  }
  for (let i = 0; i < W * H; i++) if (tok[i] >= 10) {
    disc(c, (i % W + 0.5) * S, ((i / W | 0) + 0.5) * S, S * 0.34, '#fff', 'rgba(255,255,255,.9)');
  }
}

function drawFlappy(c, tok, rgba, S, W, H) {
  const g = bgGradient(c, tok, rgba, W, H, S, t => t === 0);
  if (g) { c.fillStyle = g; c.fillRect(0, 0, W * S, H * S); }
  for (let r = 0; r < H; r++) for (let col = 0; col < W; col++) {
    const t = tok[r * W + col], x = col * S, y = r * S, i = r * W + col;
    if (t === 0 || t === 9 || t >= 11) continue;          // sky, beak, bird (drawn as a sprite)
    if (t === 1) disc(c, x + S * 0.5, y + S * 0.85, S * 0.58, PAL.flappy.bush);
    else if (t === 2) box(c, x, y, S, S, PAL.flappy.grass);
    else if (t === 3 || t === 4) box(c, x, y, S, S, px3(rgba, i));
    else if (t === 5) box(c, x, y, S, S, PAL.flappy.pipe);
    else if (t === 6) box(c, x, y, S, S, PAL.flappy.pipeEdge);
    else if (t === 7) box(c, x - S * 0.14, y, S * 1.28, S, PAL.flappy.pipeCap, S * 0.28);
    else if (t === 8) box(c, x, y, S, S, PAL.flappy.hud);
    else if (t === 10) box(c, x + S * 0.2, y + S * 0.15, S * 0.6, S * 0.7, PAL.flappy.marker, S * 0.2);
  }
  for (let i = 0; i < W * H; i++) if (tok[i] >= 11 && tok[i] <= 15) {
    const r = i / W | 0, col = i % W, v = tok[i] - 13;    // speed -2..2
    const cx = (col + 0.5) * S, cy = (r + 0.5) * S, R = S * 0.46;
    disc(c, cx, cy, R, PAL.flappy.bird);
    c.save(); c.translate(cx, cy); c.rotate(-v * 0.2);     // the wing tilts with the speed
    c.beginPath(); c.ellipse(0, R * 0.22, R * 0.66, R * 0.32, 0, 0, 7);
    c.fillStyle = 'rgba(255,255,255,.78)'; c.fill(); c.restore();
    disc(c, cx + R * 0.34, cy - R * 0.3, R * 0.19, '#2b2b2b');
    c.beginPath(); c.moveTo(cx + R * 0.55, cy - R * 0.02);
    c.lineTo(cx + R * 1.5, cy - R * 0.22); c.lineTo(cx + R * 1.5, cy + R * 0.22); c.closePath();
    c.fillStyle = PAL.flappy.beak; c.fill();
  }
}

function drawDoom(c, tok, rgba, S, W, H) {
  const g = bgGradient(c, tok, rgba, W, H, S, t => t === 0 || t === 1);
  if (g) { c.fillStyle = g; c.fillRect(0, 0, W * S, H * S); }
  for (let r = 0; r < H; r++) for (let col = 0; col < W; col++) {
    const t = tok[r * W + col], x = col * S, y = r * S, i = r * W + col;
    if (t <= 1) continue;                                 // ceiling, floor (gradient)
    if (t <= 5) box(c, x, y, S, S, px3(rgba, i));         // raycast wall columns stay crisp
    else if (t === 6) disc(c, x + S * 0.5, y + S * 0.5, S * 0.46, PAL.doomlite.enemy);
    else if (t === 7) disc(c, x + S * 0.5, y + S * 0.5, S * 0.22, PAL.doomlite.eye);
    else if (t === 8) box(c, x, y, S, S, PAL.doomlite.gun);
    else if (t === 9) box(c, x, y, S, S, PAL.doomlite.gunHi);
    else if (t === 10) disc(c, x + S * 0.5, y + S * 0.5, S * 0.52, 'rgba(255,210,70,.92)');
    else if (t === 11) box(c, x, y, S, S, 'rgba(230,20,20,.55)');
    else if (t === 12) box(c, x, y, S, S, PAL.doomlite.hud);
    else if (t === 13) box(c, x, y, S, S, PAL.doomlite.health, S * 0.3);
    else if (t === 14) box(c, x, y, S, S, PAL.doomlite.mapWall);
    else if (t === 15) box(c, x, y, S, S, PAL.doomlite.mapFloor);
    else if (t === 16) disc(c, x + S * 0.5, y + S * 0.5, S * 0.4, PAL.doomlite.mapEnemy);
    else if (t >= 17) disc(c, x + S * 0.5, y + S * 0.5, S * 0.4, PAL.doomlite.mapPlayer);
  }
}

function pacShape(c, x, y, S, heading, fill, withEye) {
  const cx = x + S, cy = y + S, R = S * 0.96;
  const a = [-Math.PI / 2, 0, Math.PI / 2, Math.PI][heading];
  c.beginPath(); c.moveTo(cx, cy);
  c.arc(cx, cy, R, a + 0.32, a - 0.32 + Math.PI * 2); c.closePath();
  c.fillStyle = fill; c.fill();
  if (withEye) disc(c, cx + Math.cos(a - Math.PI / 2) * R * 0.42, cy + Math.sin(a - Math.PI / 2) * R * 0.42, R * 0.15, PAL.pacman.eye);
}
function ghostShape(c, x, y, S, fill) {
  const w = 2 * S, h = 2 * S, r = w / 2;
  c.beginPath();
  c.moveTo(x, y + h); c.lineTo(x, y + r); c.arc(x + r, y + r, r, Math.PI, 0); c.lineTo(x + w, y + h);
  for (let k = 4; k > 0; k--) {                           // wavy skirt
    c.lineTo(x + w * (k - 0.5) / 4, y + h - S * 0.26);
    c.lineTo(x + w * (k - 1) / 4, y + h);
  }
  c.closePath(); c.fillStyle = fill; c.fill();
  for (const ex of [0.3, 0.7]) {
    disc(c, x + w * ex, y + h * 0.44, h * 0.17, '#fff');
    disc(c, x + w * ex, y + h * 0.44, h * 0.09, PAL.pacman.pupil);
  }
}
function drawPacman(c, tok, rgba, S, W, H) {
  box(c, 0, 0, W * S, H * S, '#06060f');
  for (let r = 0; r < H; r++) for (let col = 0; col < W; col++) {
    const t = tok[r * W + col], x = col * S, y = r * S, i = r * W + col;
    if (t === 0 || (t >= 12 && t <= 19)) continue;        // empty path, ghost and Pac-Man sprites
    if (t === 1) box(c, x, y, S, S, px3(rgba, i), S * 0.16);
    else if (t === 2) box(c, x, y, S, S, PAL.pacman.wallFill);
    else if (t === 3) disc(c, x + S * 0.5, y + S * 0.5, S * 0.24, PAL.pacman.pellet);
    else if (t === 4) box(c, x, y, S, S, PAL.pacman.hud);
    else if (t === 9) pacShape(c, x, y, S * 0.5, 1, PAL.pacman.body);          // a life in the HUD
    else if (t === 10 || t === 11) disc(c, x + S * 0.5, y + S * 0.5, S * 0.34, t === 10 ? PAL.pacman.ghostA : PAL.pacman.ghostB);
  }
  for (let i = 0; i < W * H; i++) {                       // ghosts: anchor is the lower-left cell
    const t = tok[i], r = i / W | 0, col = i % W;
    if (t >= 12 && t <= 15 && r % 2 === 1 && col % 2 === 0) {
      ghostShape(c, col * S, (r - 1) * S, S, t <= 13 ? PAL.pacman.ghostA : PAL.pacman.ghostB);
    }
  }
  const MOUTH = [[1, 0], [1, 1], [0, 1], [0, 0]];         // (dx, dy) per heading
  for (let i = 0; i < W * H; i++) {                       // Pac-Man: the mouth cell carries the heading
    const t = tok[i];
    if (t >= 16) {
      const r = i / W | 0, col = i % W, h = t - 16, [dx, dy] = MOUTH[h];
      pacShape(c, (col - dx) * S, (r - dy) * S, S, h, PAL.pacman.body, true);
    }
  }
}

const RENDERERS = { breakout: drawBreakout, pong: drawPong, flappy: drawFlappy, doomlite: drawDoom, pacman: drawPacman };

/** Plain per-cell upscale, for a game with no dedicated renderer. */
function fallback(c, rgba, S, W, H) {
  const off = new OffscreenCanvas(W, H);
  off.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(rgba), W, H), 0, 0);
  c.imageSmoothingEnabled = false;
  c.drawImage(off, 0, 0, W * S, H * S);
}

/** Size the canvas so one grid cell lands on a whole number of device pixels and the CSS width
 *  matches the backing store, so the browser never rescales the frame. */
function fitCanvas() {
  if (!wasm) return;
  const W = wasm.width(), H = wasm.height();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const avail = Math.min(560, screen.parentElement.clientWidth - 32, 0.7 * window.innerHeight * W / H);
  scale = Math.max(3, Math.floor(avail * dpr / W));
  screen.width = W * scale; screen.height = H * scale;
  screen.style.width = `${(W * scale / dpr).toFixed(1)}px`;
  ctx.imageSmoothingEnabled = true;
}

async function load(env) {
  const gen = ++generation;
  const { instance } = await WebAssembly.instantiateStreaming(fetch(`${env}.wasm`), {})
    .catch(async () => WebAssembly.instantiate(await (await fetch(`${env}.wasm`)).arrayBuffer(), {})); // host without application/wasm
  if (gen !== generation) return; // a newer pick won
  const e = instance.exports;
  e.init((Math.random() * 2 ** 32) >>> 0);
  const str = i => new TextDecoder().decode(new Uint8Array(e.memory.buffer, e.name_ptr(i), e.name_len(i)));
  wasm = e;
  game = str(0);
  fitCanvas();
  $('loops').innerHTML = Array.from({ length: e.max_loops() }, (_, i) => `<option value="${i + 1}">${i + 1} loop${i ? 's' : ''}</option>`).join('');
  $('pad').innerHTML = '';
  for (const [k, label] of KEYS[game] ?? []) {
    const b = document.createElement('button');
    b.textContent = label;
    b.addEventListener('pointerdown', ev => { ev.preventDefault(); press(k); });
    $('pad').append(b);
  }
  $('help').innerHTML = `env <b>${str(1)}</b>, pretrained agent <b>${str(2)}</b>. Keys: `
    + (KEYS[game] ?? []).map(([k, l]) => `<kbd>${k === ' ' ? 'space' : k}</kbd> ${l}`).join(', ')
    + ` (arrows work too); <kbd>g</kbd> agent, <kbd>l</kbd> learning, <kbd>r</kbd> learn from scratch, <kbd>1</kbd>-<kbd>${e.max_loops()}</kbd> loops, <kbd>f</kbd> fast.`;
  draw();
}

function press(k) {
  if (!wasm) return;
  if (k === 'f') { fast = !fast; return; }
  wasm.key(k.charCodeAt(0));
}

function draw() {
  const W = wasm.width(), H = wasm.height();
  const rgba = new Uint8Array(wasm.memory.buffer, wasm.rgba(), W * H * 4);
  const tok = wasm.grid ? new Uint8Array(wasm.memory.buffer, wasm.grid(), W * H) : null;
  const render = tok && RENDERERS[game];
  if (render) render(ctx, tok, rgba, scale, W, H); else fallback(ctx, rgba, scale, W, H);
  const who = wasm.human() ? 'you' : wasm.learning() ? 'stream-x LEARNING' : 'pretrained stream-x agent';
  $('stats').textContent =
    `score ${wasm.score()}  ${WON[game] ?? 'wins'} ${wasm.wins()}  lives ${wasm.lives()}  episode ${wasm.episode()}  | ${who}\n` +
    `${wasm.loops()} loops: ${modelMs.toFixed(2)} ms per dreamed frame${fast ? ' (fast)' : ''}\n` +
    (wasm.learning() || wasm.learn_steps() ? `learned for ${wasm.learn_steps()} steps, mean score of the last 10 episodes ${wasm.avg10()}` : '');
  $('agent').setAttribute('aria-pressed', String(!wasm.human()));
  $('learn').setAttribute('aria-pressed', String(!!wasm.learning()));
  $('fast').setAttribute('aria-pressed', String(fast));
  $('loops').value = wasm.loops();
}

// Human speed: one dreamed frame every HUMAN_FRAME_MS. Fast (not while you play): as many as fit in ~12 ms.
function frame(now) {
  requestAnimationFrame(frame);
  if (!wasm) return;
  const turbo = fast && !wasm.human();
  if (!turbo && now - lastStep < wasm.human_frame_ms()) return;
  lastStep = now;
  const t0 = performance.now();
  let n = 0;
  do { wasm.tick(); n++; } while (turbo && performance.now() - t0 < 12);
  modelMs = (performance.now() - t0) / n;
  draw();
}

addEventListener('keydown', ev => {
  if (ev.target.tagName === 'SELECT' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ARROWS[ev.key] ?? ev.key.toLowerCase();
  if (k.length !== 1) return;
  ev.preventDefault();
  press(k);
});
screen.addEventListener('pointerdown', () => window.focus()); // keys reach the page inside the Space's iframe
addEventListener('resize', fitCanvas);
$('agent').onclick = () => press('g');
$('learn').onclick = () => press('l');
$('relearn').onclick = () => press('r');
$('fast').onclick = () => press('f');
$('loops').onchange = ev => { press(ev.target.value); ev.target.blur(); };
$('env').onchange = ev => { load(ev.target.value); ev.target.blur(); };

fetch('envs.json').then(r => r.json()).then(envs => {
  const pick = new URLSearchParams(location.search).get('env');
  $('env').innerHTML = envs.map(e => `<option>${e}</option>`).join('');
  $('env').value = envs.includes(pick) ? pick : envs.includes('breakout') ? 'breakout' : envs[0];
  load($('env').value);
}).catch(err => { $('stats').textContent = `could not load the models (${err}); run ./build.sh and serve www/ over http`; });
requestAnimationFrame(frame);
</script>
</body>
</html>
